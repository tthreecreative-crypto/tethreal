<style>
:root{--c:#1445ce;--ink:#111a33;--mute:#5e6782;--line:#e6eaf3;--bg:#f4f6fb;--card:#fff;--ok:#16a34a;--rev:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
header{background:var(--c);color:#fff;padding:22px max(4vw,16px) 64px}header .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lg{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}.lg img{max-width:46px;max-height:46px;object-fit:contain}
header h1{margin:0;font-size:clamp(20px,3vw,28px);letter-spacing:-.02em}header p{margin:2px 0 0;opacity:.85}.lang{margin-left:auto;background:transparent;border:1.5px solid rgba(255,255,255,.6);color:#fff;border-radius:999px;padding:6px 14px;font:700 12px "Manrope",system-ui,sans-serif;cursor:pointer;min-height:36px}
main{max-width:1100px;margin:-44px auto 40px;padding:0 max(4vw,16px);display:grid;gap:16px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(17,26,51,.06)}
.bar label{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex:1 1 260px}.bar input{flex:1;min-width:0}
input,textarea{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;background:#fff;color:var(--ink);width:100%}textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--c);outline-offset:1px;border-color:transparent}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.btn{font:700 14px "Manrope",system-ui,sans-serif;border:0;border-radius:10px;padding:10px 16px;min-height:42px;cursor:pointer;background:var(--c);color:#fff}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ok{background:var(--ok)}.btn.rev{background:#fff;color:var(--rev);border:1.5px solid var(--rev)}.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.ok{border-color:#16a34a88}.card.rev{border-color:#d9770688}
.media{display:flex;gap:4px;overflow-x:auto;background:#eef1f7;scroll-snap-type:x mandatory}.media a{flex:0 0 100%;aspect-ratio:4/5;background:#e3e7f0 center/cover no-repeat;position:relative;scroll-snap-align:start;display:block}.media a span{position:absolute;inset:auto 8px 8px auto;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.media .none{flex:1;aspect-ratio:4/5;display:grid;place-items:center;color:var(--mute);font-weight:700;padding:20px;text-align:center}
.body{padding:14px;display:grid;gap:8px;flex:1;align-content:start}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute);font-weight:600}
.pf{display:inline-grid;place-items:center;min-width:28px;height:22px;border-radius:6px;color:#fff;font-size:11px;font-weight:800;padding:0 6px}
.card h2{margin:0;font-size:17px;line-height:1.3}.cap{white-space:pre-wrap;font-size:14px;color:#2b3552;max-height:7.5em;overflow:hidden;position:relative}.cap.open{max-height:none}.more{background:none;border:0;color:var(--c);font:700 13px "Manrope",system-ui,sans-serif;padding:0;cursor:pointer;justify-self:start}
.status{font-size:13px;font-weight:700;border-radius:10px;padding:8px 10px}.status.ok{background:#16a34a18;color:var(--ok)}.status.rev{background:#d9770618;color:var(--rev)}.status p{margin:4px 0 0;font-weight:500;color:var(--ink);white-space:pre-wrap}
.acts{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}.acts .btn{flex:1}.revbox{padding:0 14px 14px;display:grid;gap:8px}
.msg{text-align:center;padding:60px 20px;background:var(--card);border-radius:16px;border:1px solid var(--line)}.msg h2{margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;transition:.2s;pointer-events:none;z-index:9}.toast.show{opacity:1;transform:translateX(-50%)}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 16px 30px}
</style>

 const P=D.posts;const n={ok:0,rev:0,w:0};P.forEach(p=>{const s=p.appr&&p.appr.s;if(s==='ok')n.ok++;else if(s==='rev')n.rev++;else n.w++});const ex=new Date(D.expires);
 $('main').innerHTML=`<div class="bar"><label>${t('name')}<input id="who" value="${esc(who)}" placeholder="${t('namePh')}" maxlength="60" autocomplete="name"></label><div class="stats"><span>${P.length} ${L==='en'?'posts':'konten'}</span><span style="color:var(--ok)">✓ ${n.ok}</span><span style="color:var(--rev)">✎ ${n.rev}</span><span>${t('waiting')} ${n.w}</span></div>${n.w?`<button class="btn ok" id="all">${t('all')}</button>`:''}</div>
 ${P.length?`<div class="grid">${P.map(card).join('')}</div>`:`<div class="msg"><h2>${t('empty')}</h2></div>`}`;
 $('ft').textContent=`te.threal planner · ${t('valid')} ${ex.getDate()} ${t('M')[ex.getMonth()]} ${ex.getFullYear()}`;
 $('who').oninput=e=>{who=e.target.value.trim();try{localStorage.setItem('appr-name',who)}catch(x){}};if(openRev){const ta=document.querySelector(`[data-revta="${CSS.escape(openRev)}"]`);if(ta)ta.focus()}}
function card(p){const pf=PF[p.pf]||PF.ig,a=p.appr||{},F=Array.isArray(p.files)?p.files:[];const img=F.filter(f=>/^image\//.test(f.mime||''));
 const media=F.length?F.map((f,i)=>`<a href="${esc(view(f))}" target="_blank" rel="noopener" style="background-image:url('${esc(thumb(f))}')" aria-label="${esc(f.name)}"><span>${/^video/.test(f.mime||'')?'▶ '+t('video'):F.length>1?(i+1)+'/'+F.length:t('open')}</span></a>`).join(''):`<div class="none">${t('nofile')}</div>`;
 const st=a.s==='ok'?`<div class="status ok">✓ ${t('approved')} ${a.by?`${t('by')} ${esc(a.by)}`:''}</div>`:a.s==='rev'?`<div class="status rev">✎ ${t('revision')} ${a.by?`${t('by')} ${esc(a.by)}`:''}${a.note?`<p>${esc(a.note)}</p>`:''}</div>`:'';
 const rv=openRev===p.id;
 return `<article class="card ${a.s||''}"><div class="media">${media}</div><div class="body"><div class="meta"><span class="pf" style="background:${pf[1]}">${pf[0]}</span>${fD(p.date)} · ${esc(p.time||'')} · ${esc((t('ST')[p.st])||p.st||'')}${img.length>1?` · ${img.length} ${t('slides')}`:''}</div><h2>${esc(p.title)}</h2>${p.pil?`<div class="meta">${esc(p.pil)}</div>`:''}
 ${p.cap?`<div class="cap" id="cap-${esc(p.id)}">${esc(p.cap)}</div>${p.cap.length>220||p.cap.split('\n').length>5?`<button class="more" data-more="${esc(p.id)}">${t('more')}</button>`:''}`:''}${st}</div>
 ${rv?`<div class="revbox"><textarea data-revta="${esc(p.id)}" placeholder="${t('note')}" maxlength="1000">${esc(a.s==='rev'?a.note||'':'')}</textarea><div class="acts" style="padding:0"><button class="btn ghost" data-cancel>${t('cancel')}</button><button class="btn" style="background:var(--rev)" data-send="${esc(p.id)}">${t('send')}</button></div></div>`
 :`<div class="acts"><button class="btn ok" data-ok="${esc(p.id)}"${a.s==='ok'?' disabled':''}>✓ ${t('ok')}</button><button class="btn rev" data-rev="${esc(p.id)}">✎ ${t('rev')}</button></div>`}</article>`}
async function respond(id,s,note){if(!who){toast(t('needName'));const w=$('who');if(w)w.focus();return false}
 const {data,error}=await sb.rpc('approval_respond',{p_token:tok,p_post:id,p_status:s,p_note:note||'',p_name:who});if(error){toast(t('err'));return false}
 const p=D.posts.find(x=>x.id===id);if(p)p.appr=data;return true}
document.addEventListener('click',async e=>{const ok=e.target.closest('[data-ok]'),rv=e.target.closest('[data-rev]'),sd=e.target.closest('[data-send]'),mo=e.target.closest('[data-more]');
 if(e.target.closest('#lang')){L=L==='en'?'id':'en';try{localStorage.setItem('appr-lang',L)}catch(x){}render();return}
 if(mo){const c=$('cap-'+mo.dataset.more);const o=c.classList.toggle('open');mo.textContent=o?t('less'):t('more');return}
 if(ok){ok.disabled=true;if(await respond(ok.dataset.ok,'ok')){toast(t('saved'));render()}else ok.disabled=false;return}
 if(rv){if(!who){toast(t('needName'));$('who').focus();return}openRev=rv.dataset.rev;render();return}
 if(e.target.closest('[data-cancel]')){openRev=null;render();return}
 if(sd){const ta=document.querySelector(`[data-revta="${CSS.escape(sd.dataset.send)}"]`);const note=(ta&&ta.value||'').trim();if(!note){ta&&ta.focus();return}sd.disabled=true;if(await respond(sd.dataset.send,'rev',note)){openRev=null;toast(t('saved'));render()}else sd.disabled=false;return}
 if(e.target.closest('#all')){if(!who){toast(t('needName'));$('who').focus();return}const b=e.target.closest('#all');b.disabled=true;for(const p of D.posts.filter(p=>!(p.appr&&p.appr.s)))await respond(p.id,'ok');toast(t('saved'));render()}});
async function load(){$('ldT').textContent=L==='en'?'Loading…':'Memuat…';if(!sb||!tok){D=null;render();return}
 const {data,error}=await sb.rpc('approval_get',{p_token:tok});D=error?null:data;if(D&&!Array.isArray(D.posts))D.posts=[];render()}
load();window.addEventListener('hashchange',()=>location.reload());
})();
</script></body></html>
